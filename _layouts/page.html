---
layout: default
---
<article class="page wrap">
  <header class="page-head">
    {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.intro %}<p class="lede">{{ page.intro }}</p>{% endif %}
  </header>
  {% if page.wide %}
  {{ content }}
  {% else %}
  <div class="prose">
    {{ content }}
  </div>
  {% endif %}
</article>
